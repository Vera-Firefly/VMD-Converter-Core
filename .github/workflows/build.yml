name: Build VMD Converter Core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build native FBX reader, mandatory HPS adapter, CLI and Unity integration
        shell: pwsh
        run: ./scripts/Build-Release.ps1

      - name: Upload CLI and Unity package
        uses: actions/upload-artifact@v4
        with:
          name: VmdConverterCore-win-x64-with-Unity-package
          path: artifacts/win-x64/
          if-no-files-found: error
