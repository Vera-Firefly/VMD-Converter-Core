name: Build Unity-HPS standalone and FBX SDK
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test, and NativeAOT publish
        shell: pwsh
        run: ./scripts/Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Unity-HPS-win-x64
          path: artifacts/Unity-HPS-win-x64.zip
          if-no-files-found: error
